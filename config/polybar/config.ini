[colors]
bg  = #0a0a0a
fg  = #d0d0d0
dim = #666666

[bar/main]
width = 100%
height = 24
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding = 2
module-margin = 1
font-0 = monospace:size=10;2
modules-left = i3
modules-center = media
modules-right = stats date

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
format = <label-state>
label-focused = %name%
label-focused-overline = ${colors.fg}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.dim}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.fg}
label-urgent-padding = 1

[module/stats]
type = custom/script
exec = ~/.config/polybar/scripts/stats.sh
tail = true

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %I:%M
label = %{A1:~/.config/polybar/scripts/calendar.sh:}%date% %time%%{A}

[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
tail = true
click-left = ~/.config/polybar/scripts/media.sh popup
scroll-up = timeout 2 playerctl next
scroll-down = timeout 2 playerctl previous

[module/notif]
type = custom/script
exec = ~/.config/polybar/scripts/notif-status.sh
tail = true
