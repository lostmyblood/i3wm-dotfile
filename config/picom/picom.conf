# Minimal picom animation config (requires picom v12+)
# Polybar popups (rofi windows near the top of the screen) drift down while fading in.
# The centered launcher pops in with a simple ease-out scale.
# Everything else just pops in.

backend = "glx";
vsync = true;

# Global animations (every window)
animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    scale = 0.96;
    duration = 0.12;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    scale = 0.96;
    duration = 0.10;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.12;
  }
);

rules = (
  # Polybar popups: sit just under the bar (y-offset 28px), so y < 60
  {
    match = "(class_g = 'Rofi' || class_i = 'rofi') && y < 60";
    animations = (
      {
        triggers = ["open", "show"];
        offset-y = {
          curve = "cubic-bezier(0.25, 1, 0.5, 1)";   # easeOutQuart
          duration = 0.22;
          start = -24;
          end = 0;
        };
        opacity = {
          curve = "cubic-bezier(0.25, 1, 0.5, 1)";
          duration = 0.22;
          start = 0;
          end = "window-raw-opacity";
        };
      },
      {
        triggers = ["close", "hide"];
        offset-y = {
          curve = "cubic-bezier(0.4, 0, 0.6, 1)";
          duration = 0.15;
          start = 0;
          end = -12;
        };
        opacity = {
          curve = "cubic-bezier(0.4, 0, 0.6, 1)";
          duration = 0.15;
          start = "window-raw-opacity-before";
          end = 0;
        };
      }
    );
  },

  # Launcher: centered, so y >= 60. Scale-in from the center.
  {
    match = "(class_g = 'Rofi' || class_i = 'rofi') && y >= 60";
    animations = (
      {
        triggers = ["open", "show"];
        scale-x = {
          curve = "cubic-bezier(0.33, 1, 0.68, 1)";  # easeOutCubic
          duration = 0.2;
          start = 0.95;
          end = 1;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        opacity = {
          curve = "cubic-bezier(0.25, 1, 0.5, 1)";   # no overshoot on opacity
          duration = 0.15;
          start = 0;
          end = "window-raw-opacity";
        };
      },
      {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 0.96;
        duration = 0.10;
      }
    );
  }
);
